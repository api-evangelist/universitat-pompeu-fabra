name: Universitat Pompeu Fabra
x-type: university
x-category: Public Research University
description: >-
  Universitat Pompeu Fabra (UPF) is a public research university in Barcelona,
  Catalonia, Spain, founded in 1990 and ranked #266 in the QS World University
  Rankings 2025. UPF operates no developer portal and publishes no OpenAPI,
  AsyncAPI or SDK of its own; a re-profile on 2026-09-01 probed every candidate
  host and found none. What it does operate, verified live, is the UPF Digital
  Repository (e-Repositori) at repositori.upf.edu — self-hosted on UPF's own
  domain running DSpace 7.6.8, whose REST/HAL API answers at /server/api with 67
  link relations over 78 communities, 1,022 collections and 43,503 discoverable
  objects, and whose OAI-PMH 2.0 endpoint answers verb=Identify at
  repositori-api.upf.edu with 13 metadata formats and 100 sets. The repository,
  the host and the content are UPF's; the API contract is the DSpace project's
  generic open-source one and is deliberately not saved here. The same host runs
  a real Shibboleth SP — the REST API returns WWW-Authenticate: shibboleth with
  a Shibboleth.sso/Login location — and UPF's own SAML 2.0 Identity Provider is
  registered in eduGAIN through RedIRIS SIR, the Spanish national research and
  education federation, as entityID https://www.rediris.es/sir/upfidp with
  shibmd:Scope upf.edu, Sirtfi asserted and the REFEDS Research and Scholarship
  entity category. UPF is a Crossref member (member 14960, DOI prefix 10.31009,
  1,593 DOIs) and holds ROR 04n0g0b29; it has no DataCite client of its own.
  The "UPF en Xifres 2.0" linked open data portal that the June 2026 profile was
  built around — a CKAN action API and a Virtuoso SPARQL endpoint at
  data.upf.edu — no longer exists: data.upf.edu returns an authoritative
  NXDOMAIN from UPF's own nameservers, and both entries have been removed. Most
  other UPF software is published by research groups, above all the Music
  Technology Group on GitHub, rather than as institutional APIs.
