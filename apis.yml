  reason: covered
  detail: >-
    UPF operates no developer portal and publishes no specification of its own,
    but this is not a blank profile: a 2026-09-01 re-probe confirmed two
    institution-operated machine-readable surfaces on upf.edu (the e-Repositori
    DSpace 7.6.8 REST/HAL API and its OAI-PMH 2.0 endpoint), a deployed
    Shibboleth SP on the same host, one federation identity in eduGAIN via
    RedIRIS SIR, two identifier-registry memberships (Crossref member 14960 /
    prefix 10.31009, ROR 04n0g0b29), and one vendor tenancy behind an
    institution hostname (guiesbibtic.upf.edu CNAMEs to secure-eu.libguides.com,
    Springshare). The June 2026 profile was built around the "UPF en Xifres 2.0"
    open data portal — a CKAN action API and a Virtuoso SPARQL endpoint at
    data.upf.edu. That host is gone: an authoritative NXDOMAIN from UPF's own
    nameservers (ns1-ns6.upf.edu), reproduced against 8.8.8.8 and 1.1.1.1. The
    June profile had already observed HTTP 000 and excused it as "geo/firewall
    restrictions", cataloging the portal from documentation rather than a live
    probe; both API entries and the DeveloperPortal pointer have now been
    removed as dead. No course catalog, timetable, registrar, library discovery,
    research-computing or campus-life API was found on any upf.edu host:
    apis./developer./developers./opendata./dades./sso./idp./adas./guiadocent./
    horaris./biblioteca./cataleg./discovery./portal.upf.edu all NXDOMAIN, and
    api.upf.edu resolves to 84.89.128.15 but resets the TLS connection on every
    request. www.upf.edu, including /llms.txt, /robots.txt, /web/transparencia
    and /web/upeq/open-data, returns HTTP 403 from a Cloudflare bot challenge to
    curl with full browser headers and to WebFetch alike — live but unreadable
    by us, which is a finding about the edge, not about UPF. repositori.upf.edu
    /llms.txt returns a 200 that is an Anubis bot-check interstitial, not an
    llms.txt, so no AgentDirectives pointer is emitted.
