note: >-
  Education-regime domain-standard conformance for Universitat Pompeu Fabra,
  established by live probe on 2026-09-01 rather than from a prose claim. UPF
  publishes no OpenAPI, AsyncAPI or developer portal of its own, so every entry
  below is evidenced by an HTTP response from a named endpoint, with the status
  code recorded. Only surfaces UPF itself operates, or holds an
  institution-specific identity or membership on, are counted; the RedIRIS SIR
  federation and the Crossref/ROR registries are labelled as such. Reward-only:
  a standard with no live evidence is recorded conforms:false and is never
  inferred from the presence of the software that usually implements it.
