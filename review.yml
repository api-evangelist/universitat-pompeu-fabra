reviews:
- date: '2026-09-01'
  rating: 3
  summary: 'Re-profiled 2026-09-01 under the university pipeline, which settles who OPERATES each surface
    before saving anything. Two corrections to the June 2026 review. First, the "UPF en Xifres 2.0" open
    data portal is not firewalled — it is gone. data.upf.edu returns an authoritative NXDOMAIN from UPF''s
    own nameservers (ns1-ns6.upf.edu), reproduced against 8.8.8.8 and 1.1.1.1; the June review saw HTTP
    000, excused it as geo/firewall restriction, and cataloged the CKAN action API and the Virtuoso SPARQL
    endpoint from documentation rather than a live probe. Both entries and the DeveloperPortal pointer
    are removed as dead. Second, the profile was missing UPF''s strongest institution-operated identity
    surface: its SAML 2.0 Identity Provider registered in eduGAIN through RedIRIS SIR (entityID https://www.rediris.es/sir/upfidp,
    shibmd:Scope upf.edu, Sirtfi asserted, REFEDS Research and Scholarship), plus a real Shibboleth SP
    deployed on repositori.upf.edu and advertised by the DSpace REST API''s own WWW-Authenticate header.
    Also added: Crossref membership (member 14960, prefix 10.31009, 1,593 DOIs) and ROR 04n0g0b29, both
    recorded as registry memberships with no registry contract saved. guiesbibtic.upf.edu is a Springshare
    LibGuides tenancy behind a UPF hostname (CNAME secure-eu.libguides.com) and is recorded as tenant.
    The DSpace 7.6.8 REST/HAL API and the OAI-PMH 2.0 endpoint remain live and remain UPF''s; their contract
    is the DSpace project''s and is still not saved under this institution. Every www.upf.edu URL is behind
    a Cloudflare bot challenge (HTTP 403) — a finding about the edge, not about UPF.'
